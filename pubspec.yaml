name: lanbridge
description: "邻传 (LANBridge) — cross-platform local network file transfer."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3
  desktop_drop: ^0.6.0
  path_provider: ^2.1.5
  crypto: ^3.0.8
  basic_utils: 5.7.0
  mime: ^2.1.0
  uuid: ^4.6.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
